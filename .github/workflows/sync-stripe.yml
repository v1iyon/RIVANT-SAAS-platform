name: Sync integrations (Stripe, Shopify, Meta Ads, Google Ads)

# ОБНОВЛЕНО (аудит 30.08.2026): расписание "17,47 * * * *" (дважды в час,
# вне пиковой минуты GitHub Actions), которое раньше стояло здесь через
# `schedule:`, убрано из этого файла и перенесено во внешний сервис
# cron-job.org — он дёргает `workflow_dispatch` этого воркфлоу через GitHub
# API (POST /repos/v1iyon/RIVANT-SAAS-platform/actions/workflows/
# sync-stripe.yml/dispatches) каждые 15 минут. Логика ниже (почасовой синк
# + process-service-orders + backfill-historical в одном прогоне) не
# изменилась — изменился только источник расписания.
#
# ВАЖНО при отладке: если синк вдруг перестал идти, а в этом файле и в
# Actions всё выглядит штатно — расписание нужно смотреть НЕ здесь, а в
# аккаунте cron-job.org (Cron задания → этот job → История/Настройки). Это
# единая точка отказа вне репозитория: если бесплатный job там остановится
# (истёк токен, сработал лимит и т.п.), здесь никаких следов не будет —
# поэтому в настройках задания на cron-job.org должно быть включено
# уведомление на неудачный запуск.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-sync.mjs

      # п.9 аудита: раньше доставка допуслуг (What-If отчёт, дайджест) и
      # бекфил истории при подключении интеграции зависели ТОЛЬКО от
      # ручного клика в админке — process-service-orders и
      # backfill-historical никогда никем не вызывались автоматически.
      # Теперь оба дергаются тем же hourly-джобом, что и остальной синк —
      # без ручного одобрения. continue-on-error, чтобы сбой одного не
      # блокировал остальное (та же логика, что и в run-sync.mjs).
      - name: Process pending service orders (What-If reports, etc.)
        continue-on-error: true
        run: |
          curl -sf -X GET "https://rivant-os.com/api/cron/process-service-orders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Backfill historical data for newly connected integrations
        continue-on-error: true
        run: |
          curl -sf -X GET "https://rivant-os.com/api/cron/backfill-historical" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
