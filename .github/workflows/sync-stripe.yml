name: Sync integrations (Stripe, Shopify, Meta Ads, Google Ads)

# ОБНОВЛЕНО (аудит 30.08.2026): расписание "17,47 * * * *" (дважды в час,
# вне пиковой минуты GitHub Actions), которое раньше стояло здесь через
# `schedule:`, убрано из этого файла и перенесено во внешний сервис
# cron-job.org — он дёргает `workflow_dispatch` этого воркфлоу через GitHub
# API (POST /repos/v1iyon/RIVANT-SAAS-platform/actions/workflows/
# sync-stripe.yml/dispatches) каждые 15 минут. Логика ниже (почасовой синк
# + process-service-orders + backfill-historical в одном прогоне) не
# изменилась — изменился только источник расписания.
#
# ВАЖНО при отладке: если синк вдруг перестал идти, а в этом файле и в
# Actions всё выглядит штатно — расписание нужно смотреть НЕ здесь, а в
# аккаунте cron-job.org (Cron задания → этот job → История/Настройки). Это
# единая точка отказа вне репозитория: если бесплатный job там остановится
# (истёк токен, сработал лимит и т.п.), здесь никаких следов не будет —
# поэтому в настройках задания на cron-job.org должно быть включено
# уведомление на неудачный запуск.
on:
  workflow_dispatch: {}
  # ФІКС (аудит, п.11 риск №5): раніше єдиним джерелом розкладу був
  # зовнішній безкоштовний cron-job.org — якщо він зупиниться (протух
  # токен, впав ліміт тощо), синк тихо перестав би йти, і жодних слідів
  # цього не було б ні в репозиторії, ні в GitHub Actions. Нативний
  # `schedule:` тут — це НЕ заміна cron-job.org (той лишається основним
  # джерелом кожні 15 хв, бо GitHub-крон для публічних/безкоштовних
  # розкладів сам по собі не гарантує точний час — може запізнюватись на
  # 5-15+ хв у пікові години), а резервна лінія: якщо cron-job.org
  # замовкне, синк все одно продовжить йти раз на годину замість "ніколи",
  # поки хтось не помітить і не полагодить основний розклад.
  schedule:
    - cron: "23 * * * *" # раз на годину, у невікенду GitHub-хвилину — навмисно НЕ 0/15/30/45

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ФІКС (аудит 06.09.2026): без цих п'яти секретів
          # lib/quickbooks-oauth.js і lib/google-ads-oauth.js падали на
          # getClientCredentials() з "... is not set on the server" ще ДО
          # будь-якого запиту до Intuit/Google — тобто щогодинний синк
          # QuickBooks і Google Ads не міг пройти далі рефрешу токена
          # жодного разу, скільки б секретів не було заведено в самому
          # репозиторії: GitHub Actions не підхоплює їх у process.env сам,
          # їх обов'язково треба перелічити тут явно.
          QUICKBOOKS_ENVIRONMENT: ${{ secrets.QUICKBOOKS_ENVIRONMENT }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_SANDBOX_CLIENT_ID: ${{ secrets.QUICKBOOKS_SANDBOX_CLIENT_ID }}
          QUICKBOOKS_SANDBOX_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_SANDBOX_CLIENT_SECRET }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          # Cron health (см. lib/cron-heartbeat.mjs): если основной 15-хвилинний
          # cron-job.org замовкне і синк піде тільки раз на годину через
          # нативний fallback нижче, власник отримає алерт у Telegram сюди.
          # Якщо секрет не заведений — перевірка не падає, просто пише в
          # error_logs замість Telegram (див. cron-heartbeat.mjs).
          OWNER_TELEGRAM_CHAT_ID: ${{ secrets.OWNER_TELEGRAM_CHAT_ID }}
        run: node scripts/run-sync.mjs

      # п.9 аудита: раньше доставка допуслуг (What-If отчёт, дайджест) и
      # бекфил истории при подключении интеграции зависели ТОЛЬКО от
      # ручного клика в админке — process-service-orders и
      # backfill-historical никогда никем не вызывались автоматически.
      # Теперь оба дергаются тем же hourly-джобом, что и остальной синк —
      # без ручного одобрения. continue-on-error, чтобы сбой одного не
      # блокировал остальное (та же логика, что и в run-sync.mjs).
      - name: Process pending service orders (What-If reports, etc.)
        continue-on-error: true
        run: |
          curl -sf -X GET "https://rivant-os.com/api/cron/process-service-orders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Backfill historical data for newly connected integrations
        continue-on-error: true
        run: |
          curl -sf -X GET "https://rivant-os.com/api/cron/backfill-historical" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
